# pre-commit 钩子:提交前本地拦截 lint/格式问题(与 CI 双保险)。
# 启用:pre-commit install(未装可 pip install pre-commit / brew install pre-commit)
# 跳过一次:git commit --no-verify(应急用,别养成习惯)
repos:
  # ---- 后端:ruff 检查 + 导入排序(与 pyproject 的 ignore 配置一致)----
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        name: ruff (server)
        args: [--fix]
        files: ^apps/server/

  # ---- 前端:Prettier(components/lib/hooks/src 下)----
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        name: prettier (web)
        files: ^apps/web/(components|lib|hooks|src)/.*\.(ts|tsx|css)$
        additional_dependencies:
          - prettier@3.4.2

  # ---- 通用:大文件/合并冲突标记/私钥泄漏 ----
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key
