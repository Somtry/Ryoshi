# pre-commit 钩子:提交前本地拦截 lint/格式问题(与 CI 双保险)。
# 启用:pre-commit install(未装可 pip install pre-commit / brew install pre-commit)
# 跳过一次:git commit --no-verify(应急用,别养成习惯)
repos:
  # ---- 后端:ruff 检查 + 导入排序(与 pyproject 的 ignore 配置一致)----
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        name: ruff (server)
        args: [--fix]
        files: ^apps/server/

  # ---- 前端:Prettier(用项目本地安装的版本,language: system)----
  # 说明:mirrors-prettier 的独立环境在 pnpm + "type":"module" 项目下
  # 会误判模块类型(module is not defined),改为直接调 apps/web 里的
  # node_modules/.bin/prettier,与项目版本一致。
  - repo: local
    hooks:
      - id: prettier-web
        name: prettier (web)
        entry: apps/web/node_modules/.bin/prettier --write
        language: system
        files: ^apps/web/(components|lib|hooks|src)/.*\.(ts|tsx|css)$

  # ---- 通用:大文件/合并冲突标记/私钥泄漏 ----
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key
